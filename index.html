
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TIME SPIRIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: white;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
      font-family: Arial, sans-serif;
    }

    .spirit {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 65vh;
      max-height: 65dvh;
      object-fit: contain;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 12px;
      text-align: center;
    }

    .links a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .divider {
      color: #999;
    }
  </style>
</head>

<body>
  <img
    class="spirit"
    src="./TIME.gif"
    alt="TIME SPIRIT"
  >

  <div class="links">
    <a href="https://www.dahyeonkang.com">
      www.dahyeonkang.com
    </a>

    <span class="divider">|</span>

    <a href="https://www.instagram.com/dahyeonkang_/">
      @dahyeonkang_
    </a>
  </div>
</body>
</html>
