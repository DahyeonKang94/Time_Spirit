
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TIME SPIRIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
    }

    .spirit {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 75vh;
      max-height: 75dvh;
      object-fit: contain;
    }

    .links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .links a {
      color: #111111;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .divider {
      color: #999999;
    }
  </style>
</head>

<body>

  <img
    class="spirit"
    src="./TIME.gif"
    alt="TIME SPIRIT"
  >

  <div class="links">
    <a href="https://www.dahyeonkang.com"
       target="_blank" rel="noopener noreferrer">
      www.dahyeonkang.com
    </a>

    <span class="divider">|</span>

    <a href="https://www.instagram.com/dahyeonkang_/"
       target="_blank" rel="noopener noreferrer">
      @dahyeonkang_
    </a>
  </div>

</body>
</html>
